<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t6 d6">
<title id="t6">Panel 6: The rule</title>
<desc id="d6">The rule, in a big yellow box: if your data only has the people it happened to, you can describe them. You can't say how much anything raised their risk. For that, you need the people it didn't happen to. The lifeguard, the wedding guest, the beachgoer and the professor stand below; a burst says: try it yourself.</desc>
