<title id="t3">Panel 3: The wedding</title>
<desc id="d3">A green-faced wedding guest shouts that it was the potato salad, while across the room a table of happy guests eat the same potato salad and feel great. Box: sick guests who ate it, 36 of 40 (90%); fine guests who ate it, 144 of 160 (90%); same share, the salad raised nobody's risk.</desc>
