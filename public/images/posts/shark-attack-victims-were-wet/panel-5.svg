<title id="t5">Panel 5: Three worlds</title>
<desc id="d5">Three worlds side by side. Each has the identical case file: 40 sick, 36 ate the salad (90%). But among everyone else, 99%, 90%, or 64% ate the salad, making the salad protective (0.3 times), no effect (1.0 times), or dangerous (4.0 times). Box: the case file looks identical in all three; it can't tell you which world you're in.</desc>
