<title id="t4">Panel 4: The whiteboard</title>
<desc id="d4">A professor points at a whiteboard with a 2-by-2 table. The 'got sick' column is full of dots; the 'fine' column is hatched out with a big question mark. The board reads: risk for salad-eaters = got sick divided by (got sick + fine). You need both columns. Speech bubble: you looked at one column and asked for a ratio.</desc>
